[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uti712s"
version = "0.2.0"
description = "Extract the Celsius matrix from UNI-T UTi712S BMP files and show the temperature of each point."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Pablo Ventura" }]
keywords = ["uti712s", "uni-t", "thermal", "bmp"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
png = ["pillow"]

[project.urls]
Homepage = "https://github.com/pablogventura/uti712s"
Repository = "https://github.com/pablogventura/uti712s"

[project.scripts]
uti712s-extract = "uti712s_extract:main"
uti712s-view = "uti712s_view:main"

[tool.setuptools]
packages = []
py-modules = ["uti712s_extract", "uti712s_view"]
